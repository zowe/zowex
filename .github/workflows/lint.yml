name: Lint

on: [pull_request]

jobs:
  lint-client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome
        run: biome ci --reporter=github packages

  lint-native:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Bans string-keyed hash containers (CEE3561S at load time) and by-reference captures in
      # afterAll hooks (silently skipped cleanup). Each script's header explains why.
      - name: Run lint:tidy
        run: npm run lint:tidy

      - name: Run lint:cpp
        run: |
          npm ci --ignore-scripts
          npm run lint:cpp
