name: Lint

on: [pull_request]

jobs:
  lint-client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome
        run: biome ci --reporter=github packages

  lint-native:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # std::hash<std::string> resolves to the out-of-line libc++ helper __hash_memory, which is
      # not exported by CRTEQCXE on z/OS systems below the required Language Environment
      # maintenance level (CEE3561S at load time). See native/c/compat/README.md and
      # https://github.com/zowe/zowex/issues/871.
      - name: Check for string-keyed hash containers
        run: npm run lint:compat

      - name: Run lint:cpp
        run: |
          npx clang-format --version
          clang-format --version || echo no clang format
          npm run lint:cpp
